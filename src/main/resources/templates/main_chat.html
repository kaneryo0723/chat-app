<!DOCTYPE html>
<!-- チャット画面の部分テンプレート -->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<div th:fragment="main_chat">
  <div class="chat_header">
    <div class="left-header">
      <div class="header-title">
        hogefuga
      </div>
    </div>
    <div class="right-header">
      <div class="header-button">
        <a href="http://">チャットを終了する</a>
      </div>
    </div>
  </div>
  <div class="messages">
    <div class="message">
      <div class="upper-message">
        <div class="message-user">
          <p>Tom</p>
        </div>
        <div class="message-date">
          <p>2020/3/31(Wed) 12:43:30</p>
        </div>
      </div>
      <div class="lower-message">
        <div class="message-content">
          <p>おはよう</p>
        </div>
      </div>
    </div>
    <div class="message">
      <div class="upper-message">
        <div class="message-user">
          <p>Sin</p>
        </div>
        <div class="message-date">
          <p>2020/3/31(Wed) 12:43:30</p>
        </div>
      </div>
      <div class="lower-message">
        <div class="message-content">
          <p>こんにちは</p>
        </div>
      </div>
    </div>
  </div>
  <!-- メッセージ投稿機能を実装 -->
  <form th:action="@{/rooms/{roomId}/messages(roomId=${roomId})}" method="post" th:object="${messageForm}" class="form">
    <div class="form-input">
      <!-- メッセージ投稿機能を実装 -->
      <input th:field="*{content}" class="form-message" placeholder= "type a message">
      <label class="form-image">
        <span class="image-file">画像</span>
        <input type="file" class="hidden">
      </label>  
    </div>
    <input class="form-submit" type="submit" value="送信">  
    </form>
  </div>
</div>

</html>
