<!DOCTYPE html>
<!-- サイドバーの部分テンプレート -->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<div th:fragment="side_bar">
  <div class="side-bar-header">
    <div class="header-name">
      <a th:href="@{/users/{userId}/edit(userId=${user.id})}" th:text="${user.name}">ユーザー名</a>
      <a href="http://">Tom</a>
    </div>

    <div class="create-room">
      <!-- アットマークでパスを指定 -->
      <a th:href="@{/rooms/new}">チャットを作成する</a>
    </div>

  </div>
  <div class="rooms">
    <div th:each="room : ${rooms}" class="room">
      <div class="room-name">
        <!-- thの付け忘れに注意。ログインユーザーのみがチャットルームを見れるので、表示されないルームもある？ -->
        <a th:href="@{/rooms/{roomId}/messages(roomId=${room.id})}" th:text="${room.name}">techroom</a>
      </div>
    </div>

  </div>
</div>

</html>
